[project]
name = "voice-pipeline"
version = "0.1.0"
description = "Voice realtime call pipeline"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115.0",
  "livekit-agents[cartesia,deepgram,openai,silero]>=1.5.4",
  "pydantic-settings>=2.4.0",
  "structlog>=24.4.0",
  "uvicorn[standard]>=0.30.6",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_pipeline"]

[project.scripts]
voice-pipeline-dev = "voice_pipeline.dev:main"
voice-pipeline-worker = "voice_pipeline.interfaces.livekit.worker:main"
