[project]
name = "voice-backend"
version = "0.1.0"
description = "Voice backend control plane"
requires-python = ">=3.11,<3.13"
dependencies = [
  "cryptography>=43.0.1",
  "fastapi>=0.115.0",
  "httpx>=0.27.2",
  "livekit-api>=1.0.3",
  "pydantic>=2.8.2",
  "psycopg[binary]>=3.2.1",
  "pydantic-settings>=2.4.0",
  "sqlalchemy>=2.0.34",
  "structlog>=24.4.0",
  "uvicorn[standard]>=0.30.6",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_backend"]

[project.scripts]
voice-backend-dev = "voice_backend.dev:main"
